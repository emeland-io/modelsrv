# Auto-approve Renovate digest/patch PRs so they can automerge.
# Calls the reusable workflow in opendefensecloud/dev-kit. The automerge policy
# (which update types are eligible) comes from the renovate-config presets.
name: renovate-auto-approve
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    uses: opendefensecloud/dev-kit/.github/workflows/renovate-auto-approve.yml@81c31ba09a3cf8e117213f9392a387455706ad64
    permissions:
      contents: read
      pull-requests: write
