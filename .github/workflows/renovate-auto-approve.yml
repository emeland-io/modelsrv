# Auto-approve Renovate PRs that Renovate has marked for automerge.
# Eligibility is controlled by the automerge rules in renovate.json.
name: renovate-auto-approve

on:
  pull_request:
    types: [opened, reopened, synchronize, auto_merge_enabled]

permissions: {}

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.auto_merge
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}