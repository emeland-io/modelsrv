# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Install tools
      run: make tools

    - name: Generate
      run: make gen generate

    - name: Verify generated files are up to date
      run: |
        if ! git diff --exit-code; then
          echo "::error::Generated files are out of date. Run 'make gen generate' and commit the result."
          exit 1
        fi

    - name: Format
      run: go fmt ./...

    - name: Vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3

    - name: Nilaway
      run: make nilaway

    - name: Test
      run: go test -v ./...
