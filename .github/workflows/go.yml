# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.26.x'

    - name: Install tools
      run: make tools

    - name: Generate
      run: make gen generate

    - name: Verify generated files are up to date
      run: |
        if ! git diff --exit-code; then
          echo "::error::Generated files are out of date. Run 'make gen generate' and commit the result."
          exit 1
        fi

    - name: Format
      run: go fmt ./...

    - name: Vet
      run: go vet ./...

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0

    - name: Nilaway
      run: make nilaway

    - name: Render OpenAPI docs
      run: make api-docs API_DOCS_VERSION=ci

    - name: Test
      run: go test -v ./...
