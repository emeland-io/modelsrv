# modelsrv pipeline. modelsrv hosts the base CI config and consumes it like any
# other repo (via a local include), so there is one shared definition of the
# fleet's TBC setup. modelsrv only adds what is genuinely specific to it.
#
# The base (.gitlab/ci/base/go-service.gitlab-ci.yml) wraps the TBC golang and
# docker components and sets the org defaults (kaniko build tool, pinned
# versions, Go image). Everything below is modelsrv-only.

include:
  - local: .gitlab/ci/base/go-service.gitlab-ci.yml

variables:
  # modelsrv has its own .golangci.yml. Drop TBC's default "-E gosec" so the
  # project's own lint configuration decides what is enforced.
  GO_CI_LINT_ARGS: "./..."
  # modelsrv has no main package in the repo root; its programs live in cmd/.
  # Point the SBOM at the server binary (container images get their own SBOM
  # from docker-sbom).
  GO_SBOM_OPTS: "-main cmd/modelsrv"

# modelsrv has no root Dockerfile; lint both real Dockerfiles. hadolint is a
# single TBC job, so matrix it over the two files like the build.
docker-hadolint:
  # DL3066 (non-numeric user id) is a pre-existing nit in Dockerfile.emelandctl
  # that the old GitHub CI never checked. Ignore it here so the CI migration can
  # land; fix the Dockerfile to a numeric UID in a follow-up and drop this.
  variables:
    DOCKER_HADOLINT_ARGS: "--ignore DL3066"
  parallel:
    matrix:
      - DOCKER_FILE: deploy/container/Dockerfile.modelsrv
      - DOCKER_FILE: deploy/container/Dockerfile.emelandctl

# --- modelsrv-specific checks TBC golang does not cover --------------------
# Codegen drift (generated files must be committed), nilaway, api-docs render.
modelsrv-codegen:
  stage: build
  image: golang:1.27@sha256:205c7636d74e0ffbe3d007162df7d74f859f5a8c8322dfb9f907977686c126cf
  variables:
    GOFLAGS: "-mod=readonly"
    # nilaway peaks at about 4.6 GiB on this module even with generated files
    # skipped (see Makefile). GOMEMLIMIT on the nilaway step below keeps it at
    # about 3.2 GiB, so it stays inside the reserved request and the pod is not
    # the first to be evicted. The runner must allow the overwrite
    # (memory_{request,limit}_overwrite_max_allowed >= these values).
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "6Gi"
  script:
    - make tools
    - make gen generate
    - |
      if ! git diff --exit-code; then
        echo "Generated files are out of date. Run 'make gen generate' and commit the result." >&2
        exit 1
      fi
    # Soft heap limit: the GC works harder (roughly +20 s) instead of growing.
    - GOMEMLIMIT=2500MiB make nilaway
    - make api-docs API_DOCS_VERSION=ci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# --- two container images via the base's TBC kaniko build ------------------
# modelsrv builds two images. Define the per-image matrix once and reuse it for
# the build and the downstream scan jobs, which TBC otherwise runs against a
# single default image. These snapshot images are only build and scan targets:
# release images are built on GitHub from the mirrored tags (see README).
.image-matrix: &image-matrix
  - DOCKER_FILE: deploy/container/Dockerfile.modelsrv
    DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/modelsrv/snapshot-ci-test:$CI_COMMIT_REF_SLUG"
  - DOCKER_FILE: deploy/container/Dockerfile.emelandctl
    DOCKER_SNAPSHOT_IMAGE: "$CI_REGISTRY_IMAGE/emelandctl/snapshot-ci-test:$CI_COMMIT_REF_SLUG"

docker-kaniko-build:
  variables:
    # modelsrv's Dockerfiles live under deploy/container/ but COPY from the repo
    # root (go.mod etc.), so the build context must be the root, not the
    # Dockerfile's directory (TBC's default).
    DOCKER_CONTEXT_PATH: "."
  parallel:
    matrix: *image-matrix

# Scan each built image, not TBC's single default snapshot image.
docker-trivy:
  parallel:
    matrix: *image-matrix

docker-sbom:
  parallel:
    matrix: *image-matrix
